<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#050912">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>IBOB Jarvis Live</title>
<script>
/* ===================== SIRF YEH EK LINE BADLIYE ===================== */
const API = 'https://script.google.com/macros/s/AKfycbxC4haix_lkouMJUmu4V54buxz7OOSZJw8ax70riwPKk3yFX7ixwmiww0H9sWb_-46_/exec';
/* =================================================================== */
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050912;color:#e6ebf7;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:12px 14px}
header .t{flex:1}header b{font-size:18px;letter-spacing:.5px}header small{display:block;color:#8b9ab8;font-size:12px}
header button{background:#ffffff10;border:1px solid #ffffff22;color:#fff;border-radius:9px;padding:7px 10px;font-size:13px}
#log{flex:1;overflow-y:auto;padding:4px 14px 8px;mask-image:linear-gradient(transparent,#000 30px)}
.m{max-width:88%;margin:0 0 9px;padding:9px 12px;border-radius:15px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.u{margin-left:auto;background:#2b4fd8;border-bottom-right-radius:4px}
.b{background:#121b30;border:1px solid #22304a;border-bottom-left-radius:4px}
.e{background:#3a1420;border-color:#7a2a3a}
#stage{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
#orb{width:150px;height:150px;border-radius:50%;border:none;cursor:pointer;position:relative;color:#fff;font-size:44px;
 background:radial-gradient(circle at 35% 30%,#7dd3fc,#2563eb 45%,#1e1b4b 80%);box-shadow:0 0 40px #3b82f688,inset 0 0 30px #ffffff22;transition:transform .2s}
#orb:active{transform:scale(.95)}
#orb.listen{background:radial-gradient(circle at 35% 30%,#fca5a5,#e11d48 45%,#4c0519 80%);box-shadow:0 0 60px #f43f5e99;animation:pl 1.1s infinite}
#orb.think{animation:sp 1.2s linear infinite;background:conic-gradient(from 0deg,#fbbf24,#2563eb,#a855f7,#fbbf24)}
#orb.speak{background:radial-gradient(circle at 35% 30%,#86efac,#16a34a 45%,#052e16 80%);box-shadow:0 0 60px #22c55e99;animation:pl .7s infinite}
@keyframes pl{50%{transform:scale(1.07)}}@keyframes sp{to{transform:rotate(360deg)}}
#st{margin:14px 0 2px;font-size:15px;color:#cfe0ff;min-height:22px;text-align:center;padding:0 16px}
#heard{font-size:13px;color:#8b9ab8;min-height:18px;text-align:center;padding:0 20px}
form{display:flex;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
#q{flex:1;border:1px solid #2a3a5c;background:#121b30;color:#fff;border-radius:22px;padding:11px 15px;font-size:16px;outline:none}
#go{width:46px;height:46px;border:none;border-radius:50%;background:#2b4fd8;color:#fff;font-size:19px}
#login{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
#login h1{font-size:30px;margin:18px 0 4px}#login p{color:#9fb0d6;margin:0 0 20px}
#login input{width:100%;max-width:320px;margin:6px 0;padding:13px 15px;border-radius:12px;border:1px solid #2a3a5c;background:#121b30;color:#fff;font-size:16px}
#login button{width:100%;max-width:320px;margin-top:10px;padding:13px;border:none;border-radius:12px;background:#fbbf24;color:#0b1736;font-weight:800;font-size:16px}
#lerr{color:#ff8a8a;min-height:20px;margin-top:10px}
.mini{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7dd3fc,#2563eb 45%,#1e1b4b 80%);box-shadow:0 0 40px #3b82f688;display:flex;align-items:center;justify-content:center;font-size:36px}
.hid{display:none!important}
</style></head><body><div id="app">

<div id="login"><div class="mini">🤖</div><h1>IBOB Jarvis Live</h1><p>Boliye, Jarvis sunega aur bol ke batayega</p>
 <input id="lu" placeholder="User ID (dashboard wala)" autocapitalize="none" autocomplete="username">
 <input id="lp" type="password" placeholder="Password" autocomplete="current-password">
 <button id="lb">Login</button><div id="lerr"></div></div>

<header id="hd" class="hid"><div class="t"><b>IBOB JARVIS</b><small id="who"></small></div>
 <button id="nw" title="Nayi baat-cheet">🧹 Naya</button><button id="lo">Logout</button></header>
<div id="log" class="hid"></div>
<div id="stage" class="hid"><button id="orb">🎙️</button><div id="st">Gola dabaiye aur boliye</div><div id="heard"></div></div>
<form id="f" class="hid"><input id="q" placeholder="Ya type kariye…" autocomplete="off"><button id="go">➤</button></form>
</div>
<script>
const $ = i => document.getElementById(i);
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
let tok = ls('jvl_tok') || '', name = ls('jvl_name') || '', hist = [];
try { hist = JSON.parse(ls('jvl_hist') || '[]'); } catch (e) {}
let live = false, state = 'idle', rec = null, misses = 0, speakTimer = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

async function api(body) {
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API)) throw new Error('index.html me API wali line me apna /exec link daaliye.');
  const r = await fetch(API + '?jv=1', { method: 'POST', body: JSON.stringify(body) });   // text/plain → no CORS pre-check
  return r.json();
}
function add(cls, t) { const d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = t; $('log').appendChild(d); $('log').scrollTop = 1e9; return d; }
function set(s, msg) { state = s; $('orb').className = s === 'idle' ? '' : s; $('orb').textContent = { idle: '🎙️', listen: '👂', think: '', speak: '🔊' }[s];
  $('st').textContent = msg || { idle: live ? 'Live chalu hai…' : 'Gola dabaiye aur boliye', listen: 'Sun raha hoon… boliye', think: 'Soch raha hoon…', speak: 'Bol raha hoon… (rokne ke liye gola dabaiye)' }[s]; }
function show(on) { ['hd', 'log', 'stage', 'f'].forEach(i => $(i).classList.toggle('hid', !on)); $('login').classList.toggle('hid', on);
  if (on) { $('who').textContent = name + ' · Live'; $('log').innerHTML = ''; hist.forEach(h => add(h.r === 'm' ? 'b' : 'u', h.t));
    if (!hist.length) add('b', 'Namaste ' + name + '! 🙏 Main Jarvis hoon.\nNeeche gola dabaiye aur boliye – jaise "Agra me floor pendency kitni hai?"\nMain bol ke jawab dunga aur phir agla sawaal sununga. Band karne ke liye gola dobara dabaiye.');
    if (!SR) add('b e', 'Is browser me awaaz se puchna nahi chalta. Android pe Chrome, iPhone pe Safari me kholiye – tab tak type karke puchiye.'); set('idle'); } }

/* ---------- speaking ---------- */
function voice() { const v = speechSynthesis.getVoices(); return v.find(x => /hi[-_]IN/i.test(x.lang)) || v.find(x => /en[-_]IN/i.test(x.lang)) || null; }
function speak(text, done) {
  if (!window.speechSynthesis) { done && done(); return; }
  speechSynthesis.cancel();
  const clean = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}•*#]/gu, ' ').replace(/\s+/g, ' ').trim();
  const parts = clean.match(/[^.!?।\n]+[.!?।]?/g) || [clean];       // short pieces – long ones get cut on Android
  let i = 0; const v = voice();
  const next = () => {
    clearTimeout(speakTimer);
    if (state !== 'speak') return;
    if (i >= parts.length) { done && done(); return; }
    const u = new SpeechSynthesisUtterance(parts[i++].trim()); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'hi-IN'; u.rate = 1.05;
    u.onend = next; u.onerror = next;
    speakTimer = setTimeout(next, 1500 + u.text.length * 110);   // some phones forget to fire onend
    speechSynthesis.speak(u);
  };
  set('speak'); next();
}
function stopAll() { live = false; clearTimeout(speakTimer); try { speechSynthesis.cancel(); } catch (e) {} try { rec && rec.abort(); } catch (e) {} rec = null; set('idle'); $('heard').textContent = ''; }

/* ---------- listening ---------- */
function listen() {
  if (!SR) { stopAll(); return; }
  rec = new SR(); rec.lang = 'hi-IN'; rec.interimResults = true; rec.continuous = false; let fin = '';
  rec.onresult = e => { let t = ''; for (let k = e.resultIndex; k < e.results.length; k++) { if (e.results[k].isFinal) fin += e.results[k][0].transcript; else t += e.results[k][0].transcript; } $('heard').textContent = (fin + t).trim(); };
  rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { stopAll(); add('b e', 'Mic ki permission nahi mili. Address bar ke 🔒 → Permissions → Microphone → Allow kariye.'); } };
  rec.onend = () => { rec = null; if (!live) return;
    const q = fin.trim();
    if (q) { misses = 0; ask(q, true); }
    else if (++misses <= 2 && state === 'listen') listen();          // silence – listen a bit more
    else { stopAll(); $('st').textContent = 'Kuch sunai nahi diya – gola dabake dobara boliye'; } };
  set('listen'); $('heard').textContent = '';
  try { rec.start(); } catch (e) { stopAll(); }
}

/* ---------- asking ---------- */
async function ask(q, byVoice) {
  q = String(q || '').trim(); if (!q) return;
  add('u', q); $('heard').textContent = ''; set('think');
  try {
    const r = await api({ act: 'chat', token: tok, q: q, hist: hist, voice: !!byVoice });
    if (r.auth === false) { logout('Login expire ho gaya, dobara login kijiye.'); return; }
    if (r.err) { add('b e', '⚠️ ' + r.err); if (byVoice) speak('Maaf kijiye, ' + r.err, () => live ? listen() : set('idle')); else set('idle'); return; }
    add('b', r.text); hist.push({ r: 'u', t: q }, { r: 'm', t: r.text }); hist = hist.slice(-12); ls('jvl_hist', JSON.stringify(hist));
    if (byVoice) speak(r.text, () => { if (live) listen(); else set('idle'); }); else set('idle');
  } catch (e) { add('b e', '⚠️ ' + (e.message || e)); stopAll(); }
}

$('orb').onclick = () => {
  if (state === 'speak' || state === 'listen') { stopAll(); return; }   // tap = stop / interrupt
  if (state === 'think') return;
  speechSynthesis && speechSynthesis.speak(new SpeechSynthesisUtterance(''));   // unlocks speech on iPhone
  live = true; misses = 0; listen();
};
$('f').onsubmit = e => { e.preventDefault(); const q = $('q').value; $('q').value = ''; stopAll(); ask(q, false); };
$('nw').onclick = () => { stopAll(); hist = []; ls('jvl_hist', null); show(true); };
$('lo').onclick = () => logout();
function logout(msg) { stopAll(); tok = ''; hist = []; ls('jvl_tok', null); ls('jvl_hist', null); show(false); $('lerr').textContent = msg || ''; }
$('lb').onclick = async () => {
  const u = $('lu').value.trim(), p = $('lp').value; if (!u || !p) { $('lerr').textContent = 'User ID aur password daaliye'; return; }
  $('lb').disabled = true; $('lerr').textContent = 'Login ho raha hai…';
  try { const r = await api({ act: 'login', u: u, p: p });
    if (!r.ok) { $('lerr').textContent = r.err || 'Galat ID / password'; return; }
    tok = r.token; name = r.name; ls('jvl_tok', tok); ls('jvl_name', name); $('lp').value = ''; $('lerr').textContent = ''; show(true);
  } catch (e) { $('lerr').textContent = e.message || String(e); } finally { $('lb').disabled = false; }
};
$('lp').onkeydown = e => { if (e.key === 'Enter') $('lb').click(); };
if (window.speechSynthesis) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
show(!!tok);
</script></body></html>
